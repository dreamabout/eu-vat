name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          extensions: bcmath, dom, simplexml
          coverage: none

      - run: composer install --no-interaction --no-progress

      # cs-fixer, phpstan, phpunit. The suite never touches the network: every TEDB response it
      # reads is a committed fixture.
      - run: composer check
